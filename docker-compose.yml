version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: algoviz-postgres
    environment:
      POSTGRES_DB: algoviz
      POSTGRES_USER: algoviz_user
      POSTGRES_PASSWORD: algoviz_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: algoviz-redis
    ports:
      - "6379:6379"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: algoviz-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://algoviz_user:algoviz_password@postgres:5432/algoviz
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=http://localhost:3000
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    container_name: algoviz-web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api

volumes:
  postgres_data:
